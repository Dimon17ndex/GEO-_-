<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEOГРАФИЯ</title>
    
    <!-- Подключаем шрифт Unbounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.setHeaderColor) {
                    tg.setHeaderColor('#070707');
                }
            }

            // Функция для мягкой двойной вибрации
            function triggerHaptic() {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    const haptic = window.Telegram.WebApp.HapticFeedback;
                    // Первый легкий удар
                    haptic.impactOccurred('light');
                    // Второй еле ощутимый удар через небольшую паузу для эффекта «двойной» вибрации
                    setTimeout(() => {
                        haptic.impactOccurred('light');
                    }, 70);
                } else if (navigator.vibrate) {
                    // Запасной вариант для браузера (две короткие вибрации)
                    navigator.vibrate([15, 40, 15]);
                }
            }

            // Логика переключения вкладок с вибрацией
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');

                    // Срабатывание вибрации при нажатии
                    triggerHaptic();

                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    tabContents.forEach(content => {
                        if (content.id === targetTab) {
                            content.style.display = 'flex';
                        } else {
                            content.style.display = 'none';
                        }
                    });
                });
            });
        });
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-wrapper">
        <!-- Шапка с логотипом и названием -->
        <header class="mobile-header">
            <div class="logo-wrapper">
                <img src="images/geo_logo.png" alt="Geo Logo" class="logo">
            </div>
            <h1 class="unbounded-title">GEOГРАФИЯ</h1>
            <p class="header-desc">
                Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>
            </p>
        </header>

        <!-- Блок поиска и переключения вида -->
        <div class="search-section">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" placeholder="Поиск" autocomplete="off">
            </div>
            <button class="view-toggle-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            </button>
        </div>

        <!-- Вкладки -->
        <div class="tabs-row">
            <button class="tab-btn" data-tab="tab-navigation">Навигация</button>
            <button class="tab-btn active" data-tab="tab-questions">Вопросы</button>
        </div>

        <!-- Контент вкладки "Навигация" -->
        <main class="list-container tab-content" id="tab-navigation" style="display: none;">
            <div class="list-item action-item">
                <div class="item-icon-box plus-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <div class="item-info">
                    <span class="item-title primary-color">Добавить раздел</span>
                </div>
            </div>

            <div class="list-item">
                <div class="item-icon-box">
                    <img src="images/geo_logo.png" alt="Geo" class="list-logo">
                </div>
                <div class="item-info">
                    <span class="item-title">Основной канал</span>
                    <span class="item-subtitle">t.me/geo_rus_grafia</span>
                </div>
                <button class="item-menu-btn">•••</button>
            </div>
        </main>

        <!-- Контент вкладки "Вопросы" (активная по умолчанию) -->
        <main class="list-container tab-content" id="tab-questions" style="display: flex;">
            <div class="list-item action-item">
                <div class="item-icon-box plus-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <div class="item-info">
                    <span class="item-title primary-color">Задать вопрос</span>
                </div>
            </div>

            <div class="list-item">
                <div class="item-icon-box">
                    <img src="images/geo_logo.png" alt="Geo" class="list-logo">
                </div>
                <div class="item-info">
                    <span class="item-title">Часто задаваемые вопросы</span>
                    <span class="item-subtitle">База знаний проекта GEOГРАФИЯ</span>
                </div>
                <button class="item-menu-btn">•••</button>
            </div>
        </main>
    </div>
</body>
</html>
