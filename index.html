<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOГРАФИЯ</title>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Подключаем style.css -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- ПЕРЕОПРЕДЕЛЯЕМ СТИЛИ ДЛЯ ЧИСТОГО ФОНА --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a !important;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            position: relative;
        }

        body {
            background: #0a0a0a !important;
        }

        /* Скрываем всё лишнее из style.css */
        .main-container,
        .brand-block,
        .input-container-box,
        .settings-trigger-zone,
        .corner-icon-floating-wrapper,
        .app-banners-container,
        .dev-console,
        .shadow-layer,
        .prompt-text,
        .session-dashboard,
        .bottom-credits-wrapper {
            display: none !important;
        }

        /* Фоновый герб */
        .bg-blur-gerb {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 80vw !important;
            max-width: 800px !important;
            opacity: 0.05 !important;
            pointer-events: none !important;
            z-index: 0 !important;
            filter: blur(2px) !important;
            display: block !important;
        }

        /* Волновой контейнер */
        #bg-wave-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            pointer-events: none !important;
            z-index: 1 !important;
            overflow: hidden !important;
            display: block !important;
        }

        /* Ripple эффекты */
        .bg-wave-ripple,
        .bg-click-ripple,
        .bg-ambient-ripple,
        .bg-ambient-red,
        .bg-ambient-green {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0.4;
            animation: rippleAnim 1.5s ease-out forwards;
        }

        .bg-click-ripple {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation-duration: 1.2s;
        }

        .bg-ambient-ripple {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(0,255,110,0.15) 0%, transparent 70%);
            animation-duration: 3s;
        }

        .bg-ambient-red {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,50,50,0.15) 0%, transparent 70%);
            animation-duration: 3s;
        }

        .bg-ambient-green {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0,255,110,0.2) 0%, transparent 70%);
            animation-duration: 3s;
        }

        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Версия */
        .version-badge {
            position: fixed !important;
            bottom: 20px !important;
            left: 50% !important;
            transform: translateX(-50%) scale(0.8) !important;
            padding: 6px 18px !important;
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 50px !important;
            font-family: 'Montserrat', sans-serif !important;
            font-size: 9px !important;
            font-weight: 400 !important;
            color: rgba(255, 255, 255, 0.15) !important;
            letter-spacing: 1px !important;
            text-transform: uppercase !important;
            z-index: 9998 !important;
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.4s ease, transform 0.4s ease !important;
            display: block !important;
        }

        .version-badge.visible,
        .version-badge.show {
            opacity: 1 !important;
            transform: translateX(-50%) scale(1) !important;
        }

        /* --- СТИЛИ ДЛЯ TELEGRAM WEB APP --- */
        body.tg-webapp {
            background: var(--tg-theme-bg-color, #0a0a0a) !important;
            color: var(--tg-theme-text-color, #ffffff) !important;
        }

        /* Адаптация для мобильных */
        @media (max-width: 768px) {
            .bg-blur-gerb {
                width: 90vw !important;
                opacity: 0.08 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновый герб -->
    <img src="images/zaporozge_gerb.png" alt="Zaporozhye Big Gerb" class="bg-blur-gerb">

    <!-- Волновой контейнер -->
    <div id="bg-wave-container"></div>

    <!-- Версия -->
    <div class="version-badge" id="version-badge">PC-VERSION</div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP ---
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            document.body.classList.add('tg-webapp');
            
            const theme = tg.themeParams;
            if (theme) {
                document.documentElement.style.setProperty('--tg-theme-bg-color', theme.bg_color || '#0a0a0a');
                document.documentElement.style.setProperty('--tg-theme-text-color', theme.text_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-theme-hint-color', theme.hint_color || 'rgba(255,255,255,0.4)');
                document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', theme.secondary_bg_color || 'rgba(255,255,255,0.03)');
            }

            tg.ready();

            const user = tg.initDataUnsafe?.user;
            if (user) {
                console.log('✅ Telegram User:', user);
                console.log('👤 ID:', user.id);
                console.log('📛 Name:', user.first_name, user.last_name || '');
                console.log('👤 Username:', user.username || 'нет');
            }

            window.sendToTelegram = function(data) {
                tg.sendData(JSON.stringify(data));
            };

            window.closeTelegramApp = function() {
                tg.close();
            };
        } else {
            console.log('ℹ️ Приложение открыто не в Telegram');
        }

        // --- ЛОГИКА ВОЛН ---
        const waveContainer = document.getElementById('bg-wave-container');
        let intensityPercent = 30;
        let isTextHovered = false;

        function createBackgroundRipple(x, y, className, duration = 1500) {
            if (!waveContainer) return;
            const ripple = document.createElement('div');
            ripple.classList.add(className);
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            waveContainer.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, duration);
        }

        // Стартовый ripple
        setTimeout(() => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            createBackgroundRipple(centerX, centerY, 'bg-click-ripple');
        }, 1000);

        // Ambient волны
        function spawnAmbientWave() {
            if (intensityPercent === 0) { 
                setTimeout(spawnAmbientWave, 2000); 
                return; 
            }
            
            let spawnX = 0, spawnY = 0;
            const side = Math.floor(Math.random() * 4);
            switch(side) {
                case 0: spawnX = Math.random() * window.innerWidth; spawnY = -50; break;
                case 1: spawnX = window.innerWidth + 50; spawnY = Math.random() * window.innerHeight; break;
                case 2: spawnX = Math.random() * window.innerWidth; spawnY = window.innerHeight + 50; break;
                case 3: spawnX = -50; spawnY = Math.random() * window.innerHeight; break;
            }
            
            let currentClassName = 'bg-ambient-ripple';
            if (isTextHovered) {
                currentClassName = Math.random() > 0.5 ? 'bg-ambient-red' : 'bg-ambient-green';
            }
            
            createBackgroundRipple(spawnX, spawnY, currentClassName, 3000);
            
            const baseDelay = 800;
            const maxAdditionalDelay = 6000; 
            const factor = (100 - intensityPercent) / 100;
            setTimeout(spawnAmbientWave, baseDelay + (Math.random() * maxAdditionalDelay * factor));
        }

        setTimeout(() => { spawnAmbientWave(); }, 2000);

        // Клик для ripple
        document.addEventListener('click', (e) => {
            createBackgroundRipple(e.clientX, e.clientY, 'bg-click-ripple');
        });

        // --- ЛОГИКА ПЛАШКИ ВЕРСИИ ПО 5 КЛИКАМ ---
        (function() {
            const vBadge = document.getElementById('version-badge');
            let clickCount = 0;
            let clickTimer = null;
            let badgeHideTimer = null;

            document.addEventListener('click', (e) => {
                if (e.target.closest('input') || e.target.closest('button')) {
                    return;
                }

                clickCount++;

                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 700);

                if (clickCount >= 5) {
                    clickCount = 0;
                    clearTimeout(clickTimer);

                    if (vBadge) {
                        vBadge.classList.add('show');
                        clearTimeout(badgeHideTimer);
                        badgeHideTimer = setTimeout(() => {
                            vBadge.classList.remove('show');
                        }, 3000);
                    }
                }
            });
        })();

        console.log('✅ GEOГРАФИЯ загружена!');
        console.log('🌊 Интенсивность волн:', intensityPercent + '%');
        
        if (tg) {
            tg.sendData(JSON.stringify({
                action: 'app_loaded',
                user: tg.initDataUnsafe?.user
            }));
        }
    </script>

</body>
</html>
