<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEOГРАФИЯ</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                document.documentElement.style.setProperty('--tg-bg-color', tg.backgroundColor);
            }
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="console.js"></script>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .session-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999; 
            pointer-events: none;
            overflow: hidden;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent !important;
        }

        .dashboard-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            width: 100%;
            max-width: 800px;
            z-index: 2;
        }

        .db-brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(-10px);
            transition: opacity 0.6s ease-out, filter 0.8s ease-out, transform 0.6s ease-out;
        }

        .db-logo-icon {
            width: 90px;  
            height: 90px;
            object-fit: contain;
        }

        .db-text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .db-main-title {
            color: #ffffff;
            font-size: 32px; 
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            text-align: left;
            font-family: 'Unbounded', sans-serif;
            margin: 0;
            text-transform: uppercase;
        }

        .db-subtitle-badge {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 5px 14px;
            border-radius: 50px;
            display: inline-block;
        }

        .db-subtitle-badge span {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            display: block;
            line-height: 1;
        }

        /* Уменьшенные стили для основного блока с логотипом */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 8px;
            transform: scale(0.75); /* Уменьшаем общий размер блока на 25% */
            transform-origin: center;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .main-title {
            font-family: 'Unbounded', sans-serif;
            margin: 0;
            text-transform: uppercase;
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
        }

        .subtitle-badge {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 4px 10px;
            border-radius: 50px;
            display: inline-block;
        }

        .subtitle-badge span {
            font-family: 'Montserrat', sans-serif;
            font-size: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #ffffff;
            display: block;
            line-height: 1;
        }

        .app-banners-container {
            display: none; 
        }
    </style>
</head>
<body>

<script src="shortcuts-system.js" defer></script>

    <div class="app-banners-container">
        <div class="app-banner banner-warning">
            <span class="banner-icon">🛠</span>
            <span>Ведется разработка сайта в раннем доступе</span>
        </div>
    </div>

    <div class="shadow-layer"></div>

    <div class="main-container">
        <div class="brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="logo-icon" id="main-logo">
            <div class="text-right">
                <h1 class="main-title">
                    <span>G</span><span>E</span><span>O</span><span>Г</span><span>Р</span><span>А</span><span>Ф</span><span>И</span><span>Я</span>
                </h1>
                <div class="subtitle-badge">
                    <span>наука • образование • естествознание</span>
                </div>
            </div>
        </div>
    </div>

    <div class="session-dashboard" id="session-dashboard">
        <div class="dashboard-content-wrapper">
            <div class="db-brand-block">
                <img src="images/geo_logo.png" alt="Geo Logo" class="db-logo-icon">
                <div class="db-text-right">
                    <h1 class="db-main-title" id="db-animate-title">GEОГРАФИЯ</h1>
                    <div class="db-subtitle-badge">
                        <span>наука • образование • естествознание</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dev-console">
        <div class="console-header">
            <span>DEV CONSOLE v1.0</span>
            <button type="button" class="console-close" id="console-close-btn">&times;</button>
        </div>

        <div id="console-auth-screen" class="console-auth-container">
            <p class="auth-title">ТРЕБУЕТСЯ АВТОРИЗАЦИЯ</p>
            <div class="console-input-row">
                <span class="console-prompt">PASS&gt;</span>
                <input type="password" id="console-pass-input" placeholder="Введите пароль..." autocomplete="new-password">
                <button type="button" id="console-auth-btn" class="console-btn">Войти</button>
            </div>
            <p id="console-auth-error" class="auth-error"></p>
        </div>

        <div id="console-main-screen" class="console-main-container" style="display: none;">
            <div class="console-output" id="console-output">
                <div class="log-item system">[SYSTEM] Доступ разрешен. Сессия активна.</div>
            </div>
            <div class="console-input-row">
                <span class="console-prompt">&gt;</span>
                <input type="text" id="console-input" placeholder="Введите команду..." autocomplete="off">
            </div>
        </div>
    </div>

    <div class="version-badge" id="version-badge">TG-WEB-VERSION</div>

    <script src="console.js" defer></script>
</body>
</html>
