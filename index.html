<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEOГРАФИЯ</title>
    
    <!-- Подключаем ваши стили -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые стили для совместимости */
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        
        .main-container {
            max-width: 100%;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .main-container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>GEOГРАФИЯ</h1>
        
        <div class="project-info">
            <p>наука • образование • естествознание</p>
            <p>проект Запорожской области</p>
        </div>
        
        <div class="console-header">
            <h2>DEV CONSOLE v1.0</h2>
            <button class="close-button">×</button>
        </div>
        
        <div class="settings">
            <h2>Настройки</h2>
            <div class="setting">
                <label>
                    <input type="checkbox" id="music-toggle">
                    Музыка: <span id="music-status">on</span> / off
                </label>
            </div>
            
            <div class="setting">
                <label>
                    Интенсивность эмбиентных волн: 
                    <input type="range" min="0" max="100" value="20">
                    <span id="intensity-value">20%</span>
                </label>
            </div>
        </div>
        
        <div class="auth-section">
            <h2>Авторизация</h2>
            <div class="auth-box">
                <p>ТРЕБУЕТСЯ АВТОРИЗАЦИЯ</p>
                <input type="password" id="password-input" placeholder="PASS">
                <button id="auth-button">Войти</button>
                <p class="auth-message" id="auth-status">[SYSTEM] Доступ разрешен. Сессия активна.</p>
            </div>
        </div>
        
        <div class="console">
            <p>Нажмите на экран</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Обработка авторизации
        document.getElementById('auth-button').addEventListener('click', () => {
            const password = document.getElementById('password-input').value;
            if (password === 'your-secret-password') {
                document.getElementById('auth-status').innerText = '[SYSTEM] Доступ разрешён. Сессия активна.';
            } else {
                document.getElementById('auth-status').innerText = '[ERROR] Неверный пароль.';
            }
        });

        // Обработка музыки
        const musicToggle = document.getElementById('music-toggle');
        musicToggle.addEventListener('change', () => {
            const status = musicToggle.checked ? 'on' : 'off';
            document.getElementById('music-status').innerText = status;
        });

        // Обработка интенсивности
        const intensityRange = document.querySelector('input[type="range"]');
        intensityRange.addEventListener('input', () => {
            const value = intensityRange.value;
            document.getElementById('intensity-value').innerText = `${value}%`;
        });

        // Обработка клика по экрану
        document.querySelector('.console').addEventListener('click', () => {
            alert('Экран активирован! Добро пожаловать в DEV CONSOLE.');
            // Здесь можно добавить логику после клика
        });
    </script>
</body>
</html>
