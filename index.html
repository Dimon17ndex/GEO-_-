<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEOГРАФИЯ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.setHeaderColor) {
                    tg.setHeaderColor('#070707');
                }
            }

            // Функция для мягкой двойной вибрации
            function triggerHaptic() {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    const haptic = window.Telegram.WebApp.HapticFeedback;
                    haptic.impactOccurred('light');
                    setTimeout(() => {
                        haptic.impactOccurred('light');
                    }, 70);
                } else if (navigator.vibrate) {
                    navigator.vibrate([15, 40, 15]);
                }
            }

            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const tabsIndicator = document.querySelector('.tabs-indicator');

            // Функция для перемещения белой полоски под нужную кнопку
            function moveIndicator(btn, instant = false) {
                if (instant) {
                    tabsIndicator.style.transition = 'none';
                }
                tabsIndicator.style.width = btn.offsetWidth + 'px';
                tabsIndicator.style.left = btn.offsetLeft + 'px';
                
                if (instant) {
                    tabsIndicator.offsetHeight; // принудительный пересчет
                    tabsIndicator.style.transition = 'left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                }
            }

            // Инициализация позиции при загрузке без анимации
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) {
                moveIndicator(activeBtn, true);
            }

            window.addEventListener('load', () => {
                if (activeBtn) {
                    moveIndicator(activeBtn, true);
                }
            });

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTabId = btn.getAttribute('data-tab');
                    const targetContent = document.getElementById(targetTabId);

                    if (btn.classList.contains('active')) return;

                    triggerHaptic();

                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    moveIndicator(btn, false);

                    const currentContent = Array.from(tabContents).find(c => c.style.display === 'flex' || c.style.display === '');

                    if (currentContent && currentContent !== targetContent) {
                        currentContent.classList.add('fade-out');

                        setTimeout(() => {
                            currentContent.style.display = 'none';
                            currentContent.classList.remove('fade-out');

                            targetContent.style.display = 'flex';
                            targetContent.classList.add('fade-out');
                            targetContent.offsetHeight; 
                            targetContent.classList.remove('fade-out');
                        }, 200);
                    }
                });
            });

            // Логика перехода в режим авторизации и возврата обратно
            const profileBtn = document.getElementById('profileBtn');
            const mobileWrapper = document.querySelector('.mobile-wrapper');
            const headerDesc = document.getElementById('headerDesc');
            const unboundedTitle = document.getElementById('unboundedTitle');
            const logoContainer = document.getElementById('logoContainer');
            
            let isAuthMode = false;

            profileBtn.addEventListener('click', (e) => {
                e.preventDefault();
                triggerHaptic();
                isAuthMode = !isAuthMode;

                if (isAuthMode) {
                    // 1. Анимация смены иконки пользователя на стрелочку
                    profileBtn.classList.add('morphing');
                    setTimeout(() => {
                        profileBtn.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7"/>
                            </svg>
                        `;
                        profileBtn.classList.remove('morphing');
                    }, 150);
                    profileBtn.setAttribute('title', 'Назад');

                    // 2. Уход элементов вниз
                    mobileWrapper.classList.add('auth-mode');

                    // 3. Смена текстов и логотипа в шапке
                    headerDesc.classList.add('blur-transition');
                    setTimeout(() => {
                        headerDesc.innerHTML = 'Авторизуйтесь с вашим внутренним аккаунтом <a href="#" class="accent-link">@geo.geo</a>';
                        headerDesc.classList.remove('blur-transition');
                    }, 180);

                    unboundedTitle.classList.add('blur-transition');
                    setTimeout(() => {
                        unboundedTitle.textContent = 'АВТОРИЗАЦИЯ';
                        unboundedTitle.classList.remove('blur-transition');
                    }, 180);

                    logoContainer.classList.add('blur-transition');
                    setTimeout(() => {
                        logoContainer.innerHTML = '<span class="at-symbol">@</span>';
                        logoContainer.classList.remove('blur-transition');
                    }, 180);

                } else {
                    // Возврат обратно
                    profileBtn.classList.add('morphing');
                    setTimeout(() => {
                        profileBtn.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        `;
                        profileBtn.classList.remove('morphing');
                    }, 150);
                    profileBtn.setAttribute('title', 'Мой geo.geo');

                    // Возвращаем элементы интерфейса
                    mobileWrapper.classList.remove('auth-mode');

                    headerDesc.classList.add('blur-transition');
                    setTimeout(() => {
                        headerDesc.innerHTML = 'Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>';
                        headerDesc.classList.remove('blur-transition');
                    }, 180);

                    unboundedTitle.classList.add('blur-transition');
                    setTimeout(() => {
                        unboundedTitle.textContent = 'GEOГРАФИЯ';
                        unboundedTitle.classList.remove('blur-transition');
                    }, 180);

                    logoContainer.classList.add('blur-transition');
                    setTimeout(() => {
                        logoContainer.innerHTML = '<img src="images/geo_logo.png" alt="Geo Logo" class="logo">';
                        logoContainer.classList.remove('blur-transition');
                    }, 180);
                }
            });
        });
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-wrapper">
        <header class="mobile-header">
            <a href="#" class="profile-btn" id="profileBtn" title="Мой geo.geo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <div class="logo-wrapper" id="logoContainer">
                <img src="images/geo_logo.png" alt="Geo Logo" class="logo">
            </div>
            <h1 class="unbounded-title" id="unboundedTitle">GEOГРАФИЯ</h1>
            <p class="header-desc" id="headerDesc">
                Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>
            </p>
        </header>

        <div class="search-section collapsible-element search-element">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" placeholder="Поиск" autocomplete="off">
            </div>
            <button class="view-toggle-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            </button>
        </div>

        <div class="tabs-row collapsible-element tabs-element">
            <button class="tab-btn active" data-tab="tab-navigation">Навигация</button>
            <button class="tab-btn" data-tab="tab-questions">Вопросы</button>
            <div class="tabs-indicator"></div>
        </div>

        <main class="list-container tab-content collapsible-element content-element" id="tab-navigation" style="display: flex;">
            <div class="list-item action-item">
                <div class="item-icon-box plus-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <div class="item-info">
                    <span class="item-title primary-color">Добавить раздел</span>
                </div>
            </div>

            <div class="list-item">
                <div class="item-icon-box">
                    <img src="images/geo_logo.png" alt="Geo" class="list-logo">
                </div>
                <div class="item-info">
                    <span class="item-title">Основной канал</span>
                    <span class="item-subtitle">t.me/geo_rus_grafia</span>
                </div>
                <button class="item-menu-btn">•••</button>
            </div>
        </main>

        <main class="list-container tab-content collapsible-element content-element" id="tab-questions" style="display: none;">
            <div class="list-item action-item">
                <div class="item-icon-box plus-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <div class="item-info">
                    <span class="item-title primary-color">Задать вопрос</span>
                </div>
            </div>

            <div class="list-item">
                <div class="item-icon-box">
                    <img src="images/geo_logo.png" alt="Geo" class="list-logo">
                </div>
                <div class="item-info">
                    <span class="item-title">Часто задаваемые вопросы</span>
                    <span class="item-subtitle">База знаний проекта GEOГРАФИЯ</span>
                </div>
                <button class="item-menu-btn">•••</button>
            </div>
        </main>
    </div>
</body>
</html>
