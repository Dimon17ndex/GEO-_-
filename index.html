<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEOГРАФИЯ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-wrapper">
        <header class="mobile-header">
            <a href="#" class="profile-btn" id="profileBtn" title="Мой geo.geo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <div class="logo-wrapper" id="logoContainer">
                <img src="images/geo_logo.png" alt="Geo Logo" class="logo">
            </div>
            <h1 class="unbounded-title" id="unboundedTitle">GEOГРАФИЯ</h1>
            <p class="header-desc" id="headerDesc">
                Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>
            </p>
        </header>

        <!-- Контент для страницы "Бот" (1 кнопка) -->
        <div class="page-content active" id="page-bot">
            <div class="search-section collapsible-element">
                <!-- Поиск -->
            </div>
            <div class="tabs-row collapsible-element">
                <!-- Вкладки -->
            </div>
            <main class="list-container tab-content collapsible-element" id="tab-navigation">
                <!-- Список навигации -->
            </main>
            <main class="list-container tab-content collapsible-element" id="tab-questions">
                <!-- Список вопросов -->
            </main>
        </div>

        <!-- Контент для страницы "Поиск" (2 кнопка) -->
        <div class="page-content" id="page-search">
            <!-- Здесь будет контент поиска -->
        </div>

        <!-- Контент для страницы "Избранное" (3 кнопка) -->
        <div class="page-content" id="page-favorites">
            <!-- Здесь будет контент избранного -->
        </div>

        <!-- Контент для страницы "Профиль" (4 кнопка) -->
        <div class="page-content" id="page-profile">
            <!-- Здесь будет контент профиля -->
        </div>

        <!-- Контент для страницы "Меню" (5 кнопка) -->
        <div class="page-content" id="page-menu">
            <!-- Здесь будет контент меню -->
        </div>
    </div>

    <!-- Bottom nav и bottom sheet остаются как есть -->

<script>
window.addEventListener('DOMContentLoaded', () => {
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) {
            tg.setHeaderColor('#070707');
        }
    }

    function triggerHaptic() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            const haptic = window.Telegram.WebApp.HapticFeedback;
            haptic.impactOccurred('light');
            setTimeout(() => {
                haptic.impactOccurred('light');
            }, 70);
        } else if (navigator.vibrate) {
            navigator.vibrate([15, 40, 15]);
        }
    }

    // Переключение вкладок (Навигация / Вопросы)
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    const tabsIndicator = document.querySelector('.tabs-indicator');

    function moveIndicator(btn, instant = false) {
        if (instant) {
            tabsIndicator.style.transition = 'none';
        }
        tabsIndicator.style.width = btn.offsetWidth + 'px';
        tabsIndicator.style.left = btn.offsetLeft + 'px';
        
        if (instant) {
            tabsIndicator.offsetHeight;
            tabsIndicator.style.transition = 'left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        }
    }

    const activeBtn = document.querySelector('.tab-btn.active');
    if (activeBtn) {
        moveIndicator(activeBtn, true);
    }

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const targetTabId = btn.getAttribute('data-tab');
            const targetContent = document.getElementById(targetTabId);

            if (btn.classList.contains('active')) return;

            triggerHaptic();

            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            moveIndicator(btn, false);

            const currentContent = Array.from(tabContents).find(c => c.style.display === 'flex' || c.style.display === '');

            if (currentContent && currentContent !== targetContent) {
                currentContent.classList.add('fade-out');

                setTimeout(() => {
                    currentContent.style.display = 'none';
                    currentContent.classList.remove('fade-out');

                    targetContent.style.display = 'flex';
                    targetContent.classList.add('fade-out');
                    targetContent.offsetHeight; 
                    targetContent.classList.remove('fade-out');
                }, 200);
            }
        });
    });

    // Логика режима авторизации и нижней вкладки
    const profileBtn = document.getElementById('profileBtn');
    const mobileWrapper = document.querySelector('.mobile-wrapper');
    const headerDesc = document.getElementById('headerDesc');
    const unboundedTitle = document.getElementById('unboundedTitle');
    const logoContainer = document.getElementById('logoContainer');
    
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetHandle = document.getElementById('sheetHandle');

    let isAuthMode = false;

    function openSheet() {
        triggerHaptic();
        sheetBackdrop.classList.add('active');
    }

    function closeSheet() {
        triggerHaptic();
        sheetBackdrop.classList.remove('active');
        if (bottomSheet) {
            bottomSheet.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
            bottomSheet.style.transform = '';
        }
    }

    profileBtn.addEventListener('click', (e) => {
        e.preventDefault();
        triggerHaptic();
        isAuthMode = !isAuthMode;

        if (isAuthMode) {
            profileBtn.classList.add('morphing');
            setTimeout(() => {
                profileBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                `;
                profileBtn.classList.remove('morphing');
            }, 150);
            profileBtn.setAttribute('title', 'Назад');

            mobileWrapper.classList.add('auth-mode');

            headerDesc.classList.add('blur-transition');
            setTimeout(() => {
                headerDesc.innerHTML = 'Авторизуйтесь с вашим внутренним аккаунтом <a href="#" class="accent-link" id="authLink">@geo.geo</a>';
                headerDesc.classList.remove('blur-transition');
                
                document.getElementById('authLink').addEventListener('click', (linkEvent) => {
                    linkEvent.preventDefault();
                    openSheet();
                });
            }, 180);

            unboundedTitle.classList.add('blur-transition');
            setTimeout(() => {
                unboundedTitle.textContent = 'АВТОРИЗАЦИЯ';
                unboundedTitle.classList.remove('blur-transition');
            }, 180);

            logoContainer.classList.add('blur-transition');
            setTimeout(() => {
                logoContainer.innerHTML = '<span class="at-symbol">@</span>';
                logoContainer.classList.remove('blur-transition');
            }, 180);

            document.getElementById('bottomNav').classList.add('hidden');

        } else {
            profileBtn.classList.add('morphing');
            setTimeout(() => {
                profileBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                `;
                profileBtn.classList.remove('morphing');
            }, 150);
            profileBtn.setAttribute('title', 'Мой geo.geo');

            headerDesc.classList.add('blur-transition');
            setTimeout(() => {
                headerDesc.innerHTML = 'Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>';
                headerDesc.classList.remove('blur-transition');
            }, 180);

            unboundedTitle.classList.add('blur-transition');
            setTimeout(() => {
                unboundedTitle.textContent = 'GEOГРАФИЯ';
                unboundedTitle.classList.remove('blur-transition');
            }, 180);

            logoContainer.classList.add('blur-transition');
            setTimeout(() => {
                logoContainer.innerHTML = '<img src="images/geo_logo.png" alt="Geo Logo" class="logo">';
                logoContainer.classList.remove('blur-transition');
            }, 180);

            setTimeout(() => {
                mobileWrapper.classList.remove('auth-mode');
            }, 200);

            document.getElementById('bottomNav').classList.remove('hidden');
        }
    });

    // Закрытие по клику на затемненную зону вне вкладки
    sheetBackdrop.addEventListener('click', (e) => {
        if (e.target === sheetBackdrop) {
            closeSheet();
        }
    });

    // Закрытие по клику/тапу на серую линию-ручку
    sheetHandle.addEventListener('click', () => {
        closeSheet();
    });

    // Поддержка свайпа вниз для закрытия вкладки
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    bottomSheet.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
        bottomSheet.style.transition = 'none';
    }, { passive: true });

    bottomSheet.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentY = e.touches[0].clientY;
        let diff = currentY - startY;
        if (diff > 0) {
            bottomSheet.style.transform = `translateY(${diff}px)`;
        }
    }, { passive: true });

    bottomSheet.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        
        let diff = currentY - startY;
        if (diff > 100) {
            closeSheet();
        } else {
            bottomSheet.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
            bottomSheet.style.transform = 'translateY(0)';
        }
        startY = 0;
        currentY = 0;
    });
});

// Описания для каждой страницы
const pageDescriptions = {
    'bot': 'Этот бот проекта GEOГРАФИЯ поможет в навигации по проекту, он работает в связке с Telegram-каналом <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>',
    'search': 'Поиск по разделам и материалам проекта <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>',
    'favorites': 'Ваши избранные разделы и сохраненные материалы <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>',
    'profile': 'Ваш профиль и настройки аккаунта <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>',
    'menu': 'Дополнительные функции и настройки <a href="https://t.me/geo_rus_grafia" class="accent-link" target="_blank">GEOГРАФИЯ</a>'
};

// Функция переключения страниц
function switchPage(pageId) {
    const pageName = pageId.replace('page-', '');
    
    // Скрываем все страницы
    document.querySelectorAll('.page-content').forEach(page => {
        page.classList.remove('active');
        page.style.display = 'none';
    });
    
    // Показываем нужную страницу
    const targetPage = document.getElementById(pageId);
    if (targetPage) {
        targetPage.style.display = 'block';
        targetPage.classList.add('active');
    }
    
    // Обновляем описание
    const headerDesc = document.getElementById('headerDesc');
    if (pageDescriptions[pageName]) {
        headerDesc.innerHTML = pageDescriptions[pageName];
    }
    
    // Обновляем активную кнопку
    updateActiveNavButton(pageName);
    
    // Возвращаем логотип и заголовок к исходному состоянию (если были изменены)
    resetHeaderToDefault();
}

// Обновление активной кнопки навигации
function updateActiveNavButton(pageName) {
    const navButtons = document.querySelectorAll('.nav-icon-btn');
    const buttonIndex = {
        'bot': 0,
        'search': 1,
        'favorites': 2,
        'profile': 3,
        'menu': 4
    };
    
    navButtons.forEach((btn, index) => {
        if (index === buttonIndex[pageName]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

// Сброс заголовка к исходному состоянию
function resetHeaderToDefault() {
    const unboundedTitle = document.getElementById('unboundedTitle');
    const logoContainer = document.getElementById('logoContainer');
    
    if (unboundedTitle.textContent !== 'GEOГРАФИЯ') {
        unboundedTitle.textContent = 'GEOГРАФИЯ';
    }
    
    if (!logoContainer.querySelector('img')) {
        logoContainer.innerHTML = '<img src="images/geo_logo.png" alt="Geo Logo" class="logo">';
    }
}

// Обработчики для кнопок навигации
document.querySelectorAll('.nav-icon-btn').forEach((btn, index) => {
    btn.addEventListener('click', () => {
        const pageIds = ['page-bot', 'page-search', 'page-favorites', 'page-profile', 'page-menu'];
        const pageId = pageIds[index];
        
        triggerHaptic();
        switchPage(pageId);
    });
});
</script>

    <script src="script.js"></script>
</body>
</html>
