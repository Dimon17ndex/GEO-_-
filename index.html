<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GEOГРАФИЯ</title>

    <!-- Подключаем Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.setHeaderColor) {
                    tg.setHeaderColor('#0b0b0b');
                }
            }
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Подключаем наш мобильный стиль -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <div class="shadow-layer"></div>
    <div id="bg-wave-container"></div>

    <!-- Главный мобильный экран -->
    <div class="main-container">
        <div class="brand-block">
            <img src="images/geo_logo.png" alt="Geo Logo" class="logo-icon" id="main-logo">
            <div class="text-right">
                <h1 class="main-title">
                    <span>G</span><span>E</span><span>O</span><span>Г</span><span>Р</span><span>А</span><span>Ф</span><span>И</span><span>Я</span>
                </h1>
                <div class="subtitle-badge">
                    <span>наука • образование • естествознание</span>
                </div>
            </div>
        </div>

    <script>
        // Автоматический подъем интерфейса наверх после вступительной заставки
        window.addEventListener('load', () => {
            setTimeout(() => {
                const mainContainer = document.querySelector('.main-container');
                const inputBox = document.getElementById('input-box');
                if (mainContainer) {
                    mainContainer.classList.add('moved-to-top');
                }
                if (inputBox) {
                    inputBox.classList.add('active');
                }
            }, 3000);
        });
    </script>
</body>
</html>
